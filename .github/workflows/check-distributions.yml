name: Check plugin distributions

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build plugin distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Validate portable schemas
        run: |
          uvx --from 'check-jsonschema==0.34.1' check-jsonschema \
            --schemafile schemas/1.0.0/plugin.schema.json \
            src/plugins/portable/plugin.json
          uvx --from 'check-jsonschema==0.34.1' check-jsonschema \
            --schemafile schemas/1.0.0/mcp.schema.json \
            src/plugins/portable/mcp.json

      - name: Check distribution builder
        run: |
          uvx ruff@0.13.2 check scripts/build-distributions.py
          uvx ruff@0.13.2 format --check scripts/build-distributions.py

      - name: Build plugin distributions
        run: python3 scripts/build-distributions.py dist

      - name: Verify checksums
        working-directory: dist/site/downloads
        run: sha256sum --check SHA256SUMS
