name: Check plugin distributions

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build plugin distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Validate portable schemas
        run: |
          uvx --from 'check-jsonschema==0.34.1' check-jsonschema \
            --schemafile schemas/1.0.0/plugin.schema.json \
            src/plugins/portable/plugin.json src/plugins/chatgpt/plugin.json
          uvx --from 'check-jsonschema==0.34.1' check-jsonschema \
            --schemafile schemas/1.0.0/mcp.schema.json \
            src/plugins/portable/mcp.json src/plugins/chatgpt/mcp.json

      - name: Check distribution builder
        run: |
          uvx ruff@0.13.2 check scripts/build-distributions.py tests
          uvx ruff@0.13.2 format --check scripts/build-distributions.py tests

      - name: Test plugin distributions
        run: python3 -m unittest discover -s tests

      - name: Build plugin distributions
        run: python3 scripts/build-distributions.py dist

      - name: Verify checksums
        working-directory: dist/site/downloads
        run: sha256sum --check SHA256SUMS

  paper-simulator:
    name: Paper simulator (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dev tooling
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:paper

      - name: Launcher smoke
        run: |
          skills/coinbase-paper/scripts/coinbase-paper --version
          skills/coinbase-paper/scripts/coinbase-paper doctor --data-dir "$RUNNER_TEMP/paper"

  paper-runtime-minimum:
    name: Paper simulator on the minimum Node (22.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"

      - name: Launcher smoke (offline)
        run: |
          skills/coinbase-paper/scripts/coinbase-paper --version
          skills/coinbase-paper/scripts/coinbase-paper doctor --data-dir "$RUNNER_TEMP/paper"
          skills/coinbase-paper/scripts/coinbase-paper init --data-dir "$RUNNER_TEMP/paper"
          skills/coinbase-paper/scripts/coinbase-paper balance --data-dir "$RUNNER_TEMP/paper"

